[project]
name = "php-vibecoder"
version = "0.1.0"
description = "GenAI and RAG based PHP Vibe Coding Agent"
authors = [
    {name = "shivampathak2812",email = "pathakshivam3738@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "lxml (>=6.1.3,<7.0.0)",
    "sentence-transformers (>=6.0.1,<7.0.0)",
    "faiss-cpu (>=1.15.1,<2.0.0)",
    "streamlit (>=1.64.0,<2.0.0)",
    "google-genai (>=2.24.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"